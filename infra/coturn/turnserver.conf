# infra/coturn/turnserver.conf
#
# coturn TURN/STUN server (technologies.txt §2 — "coturn (TURN/STUN server):
# REQUIRED for real WebRTC NAT traversal"). LiveKit (infra/livekit/livekit.yaml)
# is configured to use this instance for relayed media when direct/STUN
# connectivity isn't possible (common on cellular networks and behind
# symmetric NATs/restrictive corporate firewalls — exactly the conditions a
# job seeker practicing on a laptop or phone is likely to be behind).

listening-port=3478
fingerprint
lt-cred-mech

# Static credential shared with infra/livekit/livekit.yaml's turn.username/password.
user=coach:coach_turn_secret
realm=interview-coach.local

# Relay port range for actual media (must be reachable / port-forwarded
# on the host running coturn in production).
min-port=49152
max-port=49252

# Dev defaults — no TLS cert configured locally. In production, set
# cert/pkey below and remove no-tls/no-dtls so candidates behind networks
# that block plain UDP/TCP TURN can still connect via TURN/TLS.
no-tls
no-dtls

# Replace with this host's real public IP when deploying outside of a
# single-host docker-compose setup, e.g.:
#   external-ip=203.0.113.10
# external-ip=YOUR_PUBLIC_IP_HERE

no-cli
no-loopback-peers
no-multicast-peers
