# infra/livekit/livekit.yaml
#
# Self-hosted LiveKit SFU config for local/dev docker-compose use
# (technologies.txt §2 — "LiveKit (OSS): WebRTC SFU, real-time voice rooms").
#
# PRODUCTION NOTE: when deploying behind a real public IP/domain, set
# `rtc.use_external_ip: true` (already set) and make sure the host's public
# IP is reachable on the rtc.port_range below, and point `turn.host` at your
# real coturn domain/IP (the value here assumes coturn is reachable at
# "coturn" on the docker-compose network, which only works for same-host
# deployments — replace with your TURN server's public address otherwise).

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50020
  use_external_ip: false
  stun_servers:
    - stun.l.google.com:19302

# Per technologies.txt, NAT traversal is handled by a dedicated coturn
# instance rather than LiveKit's bundled TURN server.
turn:
  enabled: false

keys:
  # MUST match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in backend/.env
  devkey: devsecret_devsecret_devsecret_32

redis:
  address: redis:6379

logging:
  level: info
  json: false

# Webhooks let the backend (app/modules/livekit/router.py) react to real
# room/participant lifecycle events (disconnects, room_finished, ...).
webhook:
  api_key: devkey
  urls:
    - http://backend:8000/api/v1/livekit/webhook/
