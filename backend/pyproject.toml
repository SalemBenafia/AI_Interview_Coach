[project]
name = "ai-interview-coach-backend"
version = "1.0.0"
description = "Real-time AI interview coaching platform — FastAPI + LangGraph + Ollama + LiveKit backend."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
